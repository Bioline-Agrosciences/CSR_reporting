[project]
name = "monthly-reporting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
monthly-reporting = "monthly_reporting:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
